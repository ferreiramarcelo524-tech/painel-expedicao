<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXPEDIÇÃO CD-84 | MONITOR TV 32"</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10; --panel:#0f141b; --panel2:#151c26; --line:rgba(255,255,255,.08);
  --text:#d5dbe3; --muted:#7f8b9b; --accent:#4da3ff; --yellow:#e3a82b; --green:#3fcf6b; --red:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow Semi Condensed','Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-variant-numeric:tabular-nums}

#meta-celebration{display:none;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:100;font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:2px;animation:rainbow 1.5s linear infinite;text-shadow:0 0 12px rgba(255,255,255,.45)}
@keyframes rainbow{0%{color:#ff0000}20%{color:#ff00ff}40%{color:#4d6bff}60%{color:#00ffff}80%{color:#00ff00}100%{color:#ffff00}}

.dashboard{display:grid;grid-template-columns:170px 1fr 270px;grid-template-rows:58px 1fr;height:100vh;gap:8px;padding:8px}

.header{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;position:relative;overflow:hidden}
.header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.header h1{font-size:1.45rem;font-weight:800;letter-spacing:.5px}
.header h1 span{color:var(--accent)}
.clock{display:flex;align-items:baseline;gap:14px}
#clock-date{font-size:.85rem;font-weight:600;color:var(--muted);text-transform:capitalize}
#clock-time{font-size:1.9rem;font-weight:800;color:#fff;letter-spacing:1px}

.sidebar{grid-row:2;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:14px 8px}
.indicator{width:100%;text-align:center}
.ring-container{position:relative;width:118px;height:118px;margin:0 auto}
svg{transform:rotate(-90deg);width:100%;height:100%}
circle{fill:none;stroke-width:7;stroke-linecap:round}
.c-bg{stroke:rgba(255,255,255,.07)}
.c-bar{stroke-dasharray:251;stroke-dashoffset:251;transition:1.5s ease}
.perc-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.55rem;font-weight:800;color:#fff}
.ind-label{font-size:.8rem;font-weight:600;color:var(--muted);margin-top:8px}
.ind-val{font-size:1.05rem;font-weight:800;margin-top:2px;color:#fff}

.main-panel,.right-panel{grid-row:2;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.panel-title{padding:10px 14px;font-size:.95rem;font-weight:700;border-bottom:1px solid var(--line);background:var(--panel2);color:#fff;display:flex;align-items:center;gap:8px}
.panel-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.scroll-area{flex:1;overflow-y:auto;scroll-behavior:smooth}

table{width:100%;border-collapse:collapse;table-layout:fixed}
th{position:sticky;top:0;background:var(--panel2);padding:8px 6px;font-size:.78rem;font-weight:600;color:var(--muted);z-index:10;border-bottom:1px solid var(--line)}
td{padding:9px 6px;font-size:1.05rem;font-weight:700;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:nth-child(even){background:rgba(255,255,255,.018)}

.right-panel td{padding:7px 6px;font-size:1rem}
.right-panel tbody tr:first-child td{background:rgba(227,168,43,.1)}

.badge{padding:4px 6px;border-radius:4px;font-size:.78rem;font-weight:800;color:#fff;display:inline-block;width:94%;text-transform:uppercase;letter-spacing:.3px}
.vez-col{color:var(--yellow);font-size:1.05rem!important;font-weight:800!important}
.placa-col{text-align:left!important;padding-left:10px!important;color:#fff;font-size:1.05rem!important;letter-spacing:1px}
.doca-col{color:var(--yellow);font-size:1.5rem!important;font-weight:800!important}
.valor-col{color:var(--green);font-size:1.05rem!important}

.abastecimento{background-color:#f7e092;color:#5c4b14}
.eletro{background-color:#0b723b}
.mateus-plus{background-color:#a30000}
.transferencia{background-color:#004d99}
.default-setor{background-color:#2a3340}
tr.s-abastecimento td:first-child{box-shadow:inset 4px 0 #f7e092}
tr.s-eletro td:first-child{box-shadow:inset 4px 0 #0b723b}
tr.s-mateus-plus td:first-child{box-shadow:inset 4px 0 #a30000}
tr.s-transferencia td:first-child{box-shadow:inset 4px 0 #004d99}
tr.s-default-setor td:first-child{box-shadow:inset 4px 0 #2a3340}

.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
@media (prefers-reduced-motion:reduce){.c-bar{transition:none}#meta-celebration{animation:none;color:#ffd84d}}
</style>
</head>
<body>

<div id="meta-celebration">🚀 META DE 1 MILHÃO ATINGIDA! 🚀</div>

<div class="dashboard">
  <header class="header">
    <h1>EXPEDIÇÃO <span>CD-84</span></h1>
    <div class="clock"><span id="clock-date">--/--/----</span><span id="clock-time">00:00:00</span></div>
  </header>

  <aside class="sidebar">
    <div class="indicator">
      <div class="ring-container">
        <svg viewBox="0 0 90 90"><circle class="c-bg" cx="45" cy="45" r="40"></circle><circle class="c-bar" id="bDia" cx="45" cy="45" r="40"></circle></svg>
        <div class="perc-txt" id="pDia">0%</div>
      </div>
      <p class="ind-label">Hoje</p>
      <div class="ind-val" id="vDia">R$ 0,00</div>
    </div>
    <div class="indicator">
      <div class="ring-container">
        <svg viewBox="0 0 90 90"><circle class="c-bg" cx="45" cy="45" r="40"></circle><circle class="c-bar" id="bMes" cx="45" cy="45" r="40"></circle></svg>
        <div class="perc-txt" id="pMes">0%</div>
      </div>
      <p class="ind-label">Mês (17M)</p>
      <div class="ind-val" id="vMes">R$ 0,00</div>
    </div>
  </aside>

  <main class="main-panel">
    <div class="panel-title">Carregamentos ativos</div>
    <div class="scroll-area">
      <table>
        <colgroup><col width="120"><col><col width="90"><col width="130"><col width="110"></colgroup>
        <thead><tr><th>Setor</th><th>Filial</th><th>Doca</th><th>Valor</th><th>Veículo</th></tr></thead>
        <tbody id="corpoPedidos"></tbody>
      </table>
    </div>
  </main>

  <aside class="right-panel">
    <div class="panel-title">Pátio / Fila</div>
    <div class="scroll-area" id="scrollPatio">
      <table>
        <colgroup><col width="55"><col width="115"><col></colgroup>
        <thead><tr><th>Vez</th><th>Placa</th><th>Cub.</th></tr></thead>
        <tbody id="corpoFila"></tbody>
      </table>
    </div>
  </aside>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";
const META_DIA = 954545;
const META_MES = 17000000;
let somTocado = false;

// ===== FILA DO APP (fila-portaria / Firestore) =====
const firebaseConfig = {
    apiKey: "AIzaSyCDv9K7VtXwe81eAzQteQb83IYkebPasgE",
    authDomain: "expedicao-antifraud.firebaseapp.com",
    projectId: "expedicao-antifraud",
    storageBucket: "expedicao-antifraud.firebasestorage.app",
    messagingSenderId: "683256630906",
    appId: "1:683256630906:web:688866abf7f2d00e6eb5c3"
};
let sheetFila = [], cubMap = {}, appFila = null;
const normPlaca = p => String(p || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const limpa = t => String(t || "").replace(/[<>&"]/g, "");

// Converte número ou texto ("R$ 1.234,56", "1234.56", 1234.56) em número
function toNum(x) {
    if (typeof x === "number") return isFinite(x) ? x : 0;
    let s = String(x == null ? "" : x).replace(/[R$\s]/g, "");
    if (!s) return 0;
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    return parseFloat(s) || 0;
}
const fmtBRL = n => n.toLocaleString("pt-br", { style: "currency", currency: "BRL" });

function renderFila() {
    let h = "";
    if (appFila !== null) {
        appFila.forEach((x, i) => {
            h += `<tr>
                <td class="vez-col">${i + 1}º</td>
                <td class="placa-col">${limpa(x.placa)}</td>
                <td style="font-size:.9rem; color:#7f8b9b">${cubMap[normPlaca(x.placa)] || '---'}</td>
            </tr>`;
        });
    } else {
        // Fallback: fila da planilha, caso o Firestore esteja indisponível
        sheetFila.forEach(x => {
            h += `<tr>
                <td class="vez-col">${x.vez}º</td>
                <td class="placa-col">${x.placa || '---'}</td>
                <td style="font-size:.9rem; color:#7f8b9b">${x.cub}</td>
            </tr>`;
        });
    }
    document.getElementById('corpoFila').innerHTML = h || "<tr><td colspan='3'>PÁTIO VAZIO</td></tr>";
}

function iniciarFilaApp() {
    firebase.firestore().collection("fila_patio").where("status", "==", "Aguardando")
        .onSnapshot(snap => {
            appFila = snap.docs.map(d => d.data())
                .sort((a, b) => (a.timestampChegada || 0) - (b.timestampChegada || 0));
            renderFila();
            startAutoscroll();
        }, err => {
            console.error("Fila do app indisponível:", err);
            appFila = null;
            renderFila();
        });
}
firebase.initializeApp(firebaseConfig);
firebase.auth().signInAnonymously().catch(e => console.error(e)).finally(iniciarFilaApp);

function updateClock() {
    const now = new Date();
    document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-br');
    document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-br', { weekday: 'short', day: '2-digit', month: 'short' });
}
setInterval(updateClock, 1000);
updateClock();

function updateRing(barId, percId, valId, percent, valStr) {
    const bar = document.getElementById(barId);
    const circ = 251;
    const offset = circ - (Math.min(percent, 100) / 100 * circ);
    bar.style.strokeDasharray = circ;
    bar.style.strokeDashoffset = offset;
    bar.style.stroke = percent < 50 ? "#ef4444" : percent < 90 ? "#e3a82b" : "#3fcf6b";
    document.getElementById(percId).innerText = Math.round(percent) + "%";
    document.getElementById(valId).innerText = valStr;
}

// Sistema de Rolagem Automática para Fila Grande
function startAutoscroll() {
    const container = document.getElementById('scrollPatio');
    clearInterval(window.patioScrollInterval);
    window.patioScrollInterval = setInterval(() => {
        if (container.scrollTop + container.clientHeight >= container.scrollHeight) {
            container.scrollTop = 0;
        } else {
            container.scrollTop += 25;
        }
    }, 3000);
}

async function sync() {
    try {
        const r = await fetch(API);
        const d = await r.json();

        // Faturamento do dia: aceita número ou texto e variações de nome do campo
        const rawDia = d.faturamento ?? d.faturamentoDia ?? d.faturamento_dia ?? d.fatDia ?? d.hoje;
        if (rawDia === undefined) console.warn("Faturamento diário ausente na resposta da API. Campos recebidos:", Object.keys(d));
        const v = toNum(rawDia);
        updateRing('bDia', 'pDia', 'vDia', (v / META_DIA) * 100, typeof rawDia === "string" && rawDia.trim() ? rawDia : fmtBRL(v));

        const celebrationEl = document.getElementById('meta-celebration');
        celebrationEl.style.display = v >= 1000000 ? 'block' : 'none';

        const rawMes = d.faturamentoMes ?? d.faturamento_mes ?? d.fatMes ?? d.mes;
        if (rawMes !== undefined) {
            const vm = toNum(rawMes);
            updateRing('bMes', 'pMes', 'vMes', (vm / META_MES) * 100, typeof rawMes === "string" && rawMes.trim() ? rawMes : fmtBRL(vm));
        }

        let hP = ""; sheetFila = []; cubMap = {};

        if (d.veiculos) {
            d.veiculos.forEach(v => {
                const doca = String(v.doca || v.DOCA || "").trim();
                const vez = String(v.vez || v.VEZ || "").trim();
                const pFat = String(v.veiculos || v.VEICULO || "").trim();
                const pPatio = String(v['PATIO CD'] || v.patio || "").trim();

                if (doca && doca !== "0" && doca !== "DOCA" && doca !== "---") {
                    const setor = (v.tipo || v.setor || "---").toUpperCase();
                    let cls = "default-setor";
                    if (setor.includes("ABAST")) cls = "abastecimento";
                    else if (setor.includes("ELETRO")) cls = "eletro";
                    else if (setor.includes("MATEUS")) cls = "mateus-plus";
                    else if (setor.includes("TRANSF")) cls = "transferencia";

                    hP += `<tr class="s-${cls}">
                        <td><span class="badge ${cls}">${setor}</span></td>
                        <td>${v.filial || '-'}</td>
                        <td class="doca-col">${doca}</td>
                        <td class="valor-col">${v.valor || '---'}</td>
                        <td>${pFat || '---'}</td>
                    </tr>`;
                }

                const cub = v.cubagem || v.CUBAGEM || '---';
                if (pPatio) cubMap[normPlaca(pPatio)] = cub;
                if (vez && vez !== "0" && vez !== "VEZ") sheetFila.push({ vez, placa: pPatio, cub });
            });
        }

        document.getElementById('corpoPedidos').innerHTML = hP || "<tr><td colspan='5'>SEM CARREGAMENTOS</td></tr>";
        renderFila();
        startAutoscroll();

    } catch (e) { console.error(e); }
}

sync();
setInterval(sync, 15000);
</script>
</body>
</html>
