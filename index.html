<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPEDIÇÃO CD-84 | MONITOR OFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --panel: #0d1117; --accent: #58a6ff;
            --yellow: #d29922; --green: #3fb950; --border: rgba(255, 255, 255, 0.1);
            --text: #c9d1d9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        /* Ajuste de Dimensões das Colunas */
        .dashboard { 
            display: grid; 
            grid-template-columns: 180px 1fr 320px; 
            grid-template-rows: 60px 1fr; 
            height: 100vh; gap: 8px; padding: 8px; 
        }
        
        .header { grid-column: 1 / -1; background: var(--panel); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border: 1px solid var(--border); }
        .header h1 { font-size: 1.3rem; font-weight: 900; }
        .header h1 span { color: var(--accent); }
        #clock-time { display: block; font-size: 1.4rem; font-weight: 900; color: var(--accent); text-align: right;}
        #clock-date { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; }

        .sidebar { grid-row: 2; background: var(--panel); border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; gap: 40px; }
        .indicator { width: 100%; text-align: center; }
        .ring-container { position: relative; width: 110px; height: 110px; margin: 0 auto; }
        svg { transform: rotate(-90deg); width: 110px; height: 110px; }
        circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .c-bg { stroke: rgba(255,255,255,0.05); }
        .c-bar { stroke-dasharray: 314; stroke-dashoffset: 314; transition: 1.5s ease; }
        .perc-txt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; font-weight: 900; }
        .ind-label { font-size: 9px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 6px; }
        .ind-val { font-size: 0.9rem; font-weight: 800; margin-top: 3px; }

        .main-panel, .right-panel { grid-row: 2; background: var(--panel); border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-title { padding: 12px 15px; font-size: 0.8rem; font-weight: 800; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--accent); }
        .scroll-area { flex: 1; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { position: sticky; top: 0; background: #161b22; padding: 10px 5px; font-size: 10px; color: #8b949e; text-transform: uppercase; z-index: 10; border-bottom: 1px solid var(--border); }
        td { padding: 10px 5px; font-size: 13px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Estilização de Badges e Colunas Específicas */
        .badge { padding: 4px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; color: white; display: inline-block; width: 100%; max-width: 120px; text-transform: uppercase; }
        .vez-col { color: var(--yellow); font-size: 16px !important; width: 60px; font-weight: 900; }
        .placa-col { text-align: left !important; padding-left: 15px !important; color: #fff; font-size: 14px !important; width: 140px; }
        .doca-col { color: var(--yellow); font-size: 15px !important; }
        .valor-col { color: var(--green); font-family: monospace; }

        /* Cores dos Setores (Conforme solicitado) */
        .abastecimento { background-color: #f7e092; color: #5c4b14; }
        .eletro { background-color: #0b723b; color: #fff; }
        .mateus-plus { background-color: #a30000; color: #fff; }
        .transferencia { background-color: #004d99; color: #fff; }
        .retirada { background-color: #4b2c73; color: #fff; }
        .almoxarifado { background-color: #733b00; color: #fff; }
        .ponta-estoque { background-color: #b3d9ff; color: #004d99; }
        .default-setor { background-color: #21262d; color: #c9d1d9; }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="header">
            <h1>EXPEDIÇÃO <span>CD-84</span></h1>
            <div><span id="clock-date">--/--/----</span><span id="clock-time">00:00:00</span></div>
        </header>

        <aside class="sidebar">
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="55" cy="55" r="50"></circle><circle class="c-bar" id="bDia" cx="55" cy="55" r="50"></circle></svg>
                    <div class="perc-txt" id="pDia">0%</div>
                </div>
                <p class="ind-label">Faturamento Hoje</p>
                <div class="ind-val" id="vDia">R$ 0,00</div>
            </div>
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="55" cy="55" r="50"></circle><circle class="c-bar" id="bMes" cx="55" cy="55" r="50"></circle></svg>
                    <div class="perc-txt" id="pMes">0%</div>
                </div>
                <p class="ind-label">Meta Mês (21M)</p>
                <div class="ind-val" id="vMes">R$ 0,00</div>
            </div>
        </aside>

        <main class="main-panel">
            <div class="panel-title">VEÍCULOS EM CARREGAMENTO</div>
            <div class="scroll-area">
                <table>
                    <colgroup><col width="130"><col><col width="100"><col width="140"><col width="120"></colgroup>
                    <thead><tr><th>Setor</th><th>Filial</th><th>Doca</th><th>Valor</th><th>Veículo</th></tr></thead>
                    <tbody id="corpoPedidos"></tbody>
                </table>
            </div>
        </main>

        <aside class="right-panel">
            <div class="panel-title">ORDEM DE CHEGADA</div>
            <div class="scroll-area">
                <table>
                    <thead><tr><th width="60">Vez</th><th width="140">Placa</th><th>Cubagem</th></tr></thead>
                    <tbody id="corpoFila"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-br');
            document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-br', { weekday: 'short', day: '2-digit', month: 'short' });
        }
        setInterval(updateClock, 1000);

        function updateRing(barId, percId, valId, percent, valStr) {
            const bar = document.getElementById(barId);
            const circ = 314; 
            const offset = circ - (Math.min(percent, 100) / 100 * circ);
            bar.style.strokeDasharray = circ;
            bar.style.strokeDashoffset = offset;
            bar.style.stroke = percent < 50 ? "#da3633" : percent < 90 ? "#d29922" : "#3fb950";
            document.getElementById(percId).innerText = Math.round(percent) + "%";
            document.getElementById(valId).innerText = valStr;
        }

        async function sync() {
            try {
                const r = await fetch(API);
                const d = await r.json();

                if(d.faturamento) {
                    let v = parseFloat(d.faturamento.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bDia', 'pDia', 'vDia', (v/954545)*100, d.faturamento);
                }
                if(d.faturamentoMes) {
                    let vm = parseFloat(d.faturamentoMes.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bMes', 'pMes', 'vMes', (vm/21000000)*100, d.faturamentoMes);
                }

                let hP = ""; let hF = "";

                if (d.veiculos) {
                    d.veiculos.forEach(v => {
                        const doca = String(v.doca || v.DOCA || "").trim();
                        const vez = String(v.vez || v.VEZ || "").trim();
                        const pFat = String(v.veiculos || v.VEICULO || "").trim();
                        const pPatio = String(v['PATIO CD'] || v.patio || "").trim();

                        if (doca && doca !== "0" && doca !== "DOCA" && doca !== "---") {
                            const setor = (v.tipo || v.setor || "---").toUpperCase();
                            let cls = "default-setor";
                            if(setor.includes("ABAST")) cls="abastecimento";
                            else if(setor.includes("ELETRO")) cls="eletro";
                            else if(setor.includes("MATEUS")) cls="mateus-plus";
                            else if(setor.includes("TRANSF")) cls="transferencia";
                            else if(setor.includes("RETIRADA")) cls="retirada";
                            else if(setor.includes("ALMOX")) cls="almoxarifado";
                            else if(setor.includes("PONTA")) cls="ponta-estoque";

                            hP += `<tr>
                                <td><span class="badge ${cls}">${setor}</span></td>
                                <td>${v.filial || '-'}</td>
                                <td class="doca-col">${doca}</td>
                                <td class="valor-col">${v.valor || '---'}</td>
                                <td>${pFat || '---'}</td>
                            </tr>`;
                        }

                        if (vez && vez !== "0" && vez !== "VEZ") {
                            hF += `<tr>
                                <td class="vez-col">${vez}º</td>
                                <td class="placa-col">${pPatio || '---'}</td>
                                <td style="color:#8b949e">${v.cubagem || v.CUBAGEM || '---'}</td>
                            </tr>`;
                        }
                    });
                }

                document.getElementById('corpoPedidos').innerHTML = hP || "<tr><td colspan='5'>PÁTIO VAZIO</td></tr>";
                document.getElementById('corpoFila').innerHTML = hF || "<tr><td colspan='3'>SEM VEÍCULOS NA FILA</td></tr>";

            } catch (e) { console.error(e); }
        }

        sync();
        setInterval(sync, 15000);
    </script>
</body>
</html>
