<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EXPEDIÇÃO CD-84</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b10;
  --surface: #0e1420;
  --surface2: #131926;
  --accent: #00d4ff;
  --accent2: #ff6b35;
  --green: #00e676;
  --yellow: #ffc400;
  --red: #ff4444;
  --muted: #4a5568;
  --text: #e2e8f0;
  --text2: #8892a0;
  --border: rgba(0,212,255,0.08);
  --border2: rgba(255,255,255,0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: 0.03em;
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ─────────────────────────────────────────────── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: 0.08em;
  color: #fff;
}

.brand-title span { color: var(--accent); }

.brand-sub {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--muted);
  text-transform: uppercase;
}

.header-clock {
  text-align: right;
}

#relogio {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 1.6rem;
  color: var(--accent);
  letter-spacing: 0.05em;
  line-height: 1;
}

#datahoje {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 3px;
}

/* ── MÉTRICAS ─────────────────────────────────────────────── */
.metricas {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 12px 0;
}

.metrica-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}

.metrica-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0.5;
}

.metrica-card.mes::before { background: var(--accent2); }

.metrica-label {
  font-size: 8px;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.metrica-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.metrica-valor {
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 1.05rem;
  color: var(--text);
  white-space: nowrap;
}

.ring-wrap { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
.ring-wrap svg { transform: rotate(-90deg); width: 46px; height: 46px; }
.ring-wrap circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.r-bg { stroke: rgba(255,255,255,0.06); }
.r-bar { stroke-dasharray: 120; stroke-dashoffset: 120; transition: 1.2s ease; }
.ring-pct {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 9px;
  line-height: 1;
}

/* ── STATUS BAR ─────────────────────────────────────────────── */
.status-bar {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.status-bar::-webkit-scrollbar { display: none; }

.stat-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 6px 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

.stat-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.stat-dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
.stat-dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
.stat-dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }

.stat-label { font-size: 10px; color: var(--text2); }
.stat-val { font-size: 10px; font-weight: 700; color: var(--text); }

/* ── PAINÉIS ─────────────────────────────────────────────── */
.paineis {
  padding: 0 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}

.painel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  overflow: hidden;
}

.painel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border2);
  background: rgba(255,255,255,0.015);
}

.painel-title {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.painel-title.blue { color: var(--accent); }
.painel-title.orange { color: var(--accent2); }

.painel-count {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 2px 8px;
  font-size: 10px;
  color: var(--muted);
}

/* ── TABELA PEDIDOS ─────────────────────────────────────────── */
.scroll-area { overflow-y: auto; max-height: 320px; }

table { width: 100%; border-collapse: collapse; }

th {
  position: sticky;
  top: 0;
  background: #0e1420;
  padding: 5px 6px;
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-bottom: 1px solid var(--border2);
  text-align: left;
  z-index: 5;
}

th:first-child { padding-left: 14px; }
th:last-child { padding-right: 14px; text-align: right; }

td {
  padding: 5px 6px;
  font-size: 11px;
  border-bottom: 1px solid rgba(255,255,255,0.025);
  vertical-align: middle;
}

td:first-child { padding-left: 14px; }
td:last-child { padding-right: 14px; text-align: right; }

tr:last-child td { border-bottom: none; }

tr:hover td { background: rgba(255,255,255,0.02); }

.tipo-badge {
  display: inline-block;
  padding: 3px 7px;
  border-radius: 4px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.1em;
  border: 1px solid currentColor;
}

.filial-txt { color: var(--text); font-weight: 700; font-size: 12px; }
.doca-txt { color: var(--yellow); font-weight: 700; }
.valor-txt { color: var(--green); font-weight: 700; }
.veiculo-txt { color: var(--text2); font-size: 11px; }
.hora-txt { color: var(--muted); font-size: 10px; }

/* ── FILA ─────────────────────────────────────────────────── */
.fila-list { padding: 4px 0; }

.fila-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.025);
  transition: background 0.15s;
}

.fila-item:last-child { border-bottom: none; }
.fila-item:hover { background: rgba(255,255,255,0.02); }

.fila-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-weight: 800;
  font-size: 12px;
  color: var(--yellow);
  flex-shrink: 0;
}

.fila-num.primeiro {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 10px rgba(0,212,255,0.15);
}

.fila-info { flex: 1; }

.fila-placa {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.05em;
}

.fila-cub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── VAZIO ─────────────────────────────────────────────────── */
.vazio {
  padding: 30px 14px;
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.1em;
}

/* ── PING INDICATOR ─────────────────────────────────────────── */
.ping-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 9px;
  color: var(--muted);
  padding: 8px 20px;
  justify-content: flex-end;
}

.ping-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 5px var(--green);
  animation: blink 2s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── DESKTOP ─────────────────────────────────────────────────── */
@media (min-width: 900px) {
  .conteudo {
    display: grid;
    grid-template-columns: 340px 1fr 320px;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 62px);
    overflow: hidden;
  }

  .col-esq {
    border-right: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .col-meio {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .col-dir {
    border-left: 1px solid var(--border2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .metricas {
    padding: 16px;
    flex-direction: column;
  }

  .status-bar { padding: 10px 16px; flex-wrap: wrap; }

  .paineis { 
    flex: 1;
    padding: 12px 16px;
    overflow: hidden;
  }

  .painel {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .scroll-area { max-height: none; flex: 1; }
  .fila-list { flex: 1; overflow-y: auto; }

  .painel-pedidos {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin: 12px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    background: var(--surface);
  }

  .painel-pedidos .scroll-area { flex: 1; }
}
</style>
</head>

    <div class="status-bar" id="statusBar">
      <div class="stat-pill">

      </div>

  <!-- COLUNA CENTRO: pedidos -->
  <div class="col-meio">
    <div class="painel-pedidos">
      <div class="painel-header">
        <span class="painel-title blue">Pedidos em Carregamento</span>
        <span class="painel-count" id="ctPedidos">0</span>
      </div>
      <div class="scroll-area">
        <table>
          <thead>
            <tr>
              <th>Setor</th>
              <th>Filial</th>
              <th>Doca</th>
              <th>Veículo</th>
              <th>Hora</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="corpoPedidos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- COLUNA DIREITA: fila desktop -->
  <div class="col-dir">
    <div class="paineis" style="overflow-y:auto">
      <div class="painel" style="background:transparent;border:none;border-radius:0">
        <div class="painel-header" style="background:var(--surface);border-radius:10px 10px 0 0;border:1px solid var(--border2);border-bottom-color:transparent">
          <span class="painel-title orange">Ordem de Chegada — Pátio CD</span>
          <span class="painel-count" id="ctFilaDesk">0</span>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border2);border-top:none;border-radius:0 0 10px 10px;overflow:hidden">
          <div class="fila-list" id="listaFilaDesk"></div>
        </div>
      </div>

    <div class="ping-wrap">
      <div class="ping-dot"></div>
      <span id="ultimaSync">atualizando…</span>
    </div>
  </div>

<script>
// ── RELÓGIO ────────────────────────────────────────────────
const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('relogio').textContent = `${h}:${m}:${s}`;
  document.getElementById('datahoje').textContent =
    `${dias[now.getDay()]} ${now.getDate()} ${meses[now.getMonth()]} ${now.getFullYear()}`;
}
tick();
setInterval(tick, 1000);

// ── LAYOUT RESPONSIVO ──────────────────────────────────────
function layoutMobile() {
  const mob = window.innerWidth < 900;
  document.getElementById('mobileFila').style.display = mob ? 'flex' : 'none';
  document.querySelector('.col-dir').style.display = mob ? 'none' : '';
}
layoutMobile();
window.addEventListener('resize', layoutMobile);

// ── RING ──────────────────────────────────────────────────
function updateRing(barId, percId, valId, pct, valStr) {
  const circ = 2 * Math.PI * 19;
  const offset = circ - (pct / 100) * circ;
  const color = pct < 50 ? 'var(--red)' : pct < 90 ? 'var(--yellow)' : 'var(--green)';
  const bar = document.getElementById(barId);
  bar.style.strokeDasharray = circ;
  bar.style.strokeDashoffset = offset;
  bar.style.stroke = color;
  document.getElementById(percId).textContent = Math.round(pct) + '%';
  document.getElementById(percId).style.color = color;
  document.getElementById(valId).style.color = color;
  document.getElementById(valId).textContent = valStr;
}

// ── FILA HTML ──────────────────────────────────────────────
function renderFila(veiculos) {
  const items = veiculos.filter(v => v.vez || v.patio);
  const html = items.length
    ? items.map((v, i) => `
        <div class="fila-item">
          <div class="fila-num ${i === 0 ? 'primeiro' : ''}">${v.vez || (i+1)}</div>
          <div class="fila-info">
            <div class="fila-placa">${v.patio || v.veiculos || '---'}</div>
            <div class="fila-cub">${v.cubagem || '—'}</div>
          </div>
        </div>`).join('')
    : '<div class="vazio">Nenhum veículo aguardando</div>';

  const ct = items.length;
  document.getElementById('listaFilaMobile').innerHTML = html;
  document.getElementById('listaFilaDesk').innerHTML = html;
  document.getElementById('ctFila').textContent = ct;
  document.getElementById('ctFilaDesk').textContent = ct;
  document.getElementById('stFila').textContent = ct;
}

// ── PEDIDOS HTML ───────────────────────────────────────────
function tipoColor(tipo) {
  if (!tipo) return '#888';
  if (tipo.includes('ABASTECIMENTO')) return '#ffc400';
  if (tipo.includes('ELETRO')) return '#00e676';
  return '#ff6b35';
}

function renderPedidos(veiculos) {
  const items = veiculos.filter(v => v.doca && v.tipo);
  document.getElementById('ctPedidos').textContent = items.length;
  document.getElementById('stPedidos').textContent = items.length;

  const docas = [...new Set(items.map(v => v.doca).filter(Boolean))].length;
  document.getElementById('stDocas').textContent = docas;

  document.getElementById('corpoPedidos').innerHTML = items.length
    ? items.map(v => {
        const c = tipoColor(v.tipo);
        return `<tr>
          <td><span class="tipo-badge" style="color:${c};border-color:${c}40">${v.tipo}</span></td>
          <td class="filial-txt">${v.filial}</td>
          <td class="doca-txt">${v.doca}</td>
          <td class="veiculo-txt">${v.veiculos || '---'}</td>
          <td class="hora-txt">${v.data || '—'}</td>
          <td class="valor-txt">${v.valor}</td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="6" class="vazio">Nenhum pedido em carregamento</td></tr>`;
}

// ── SYNC ──────────────────────────────────────────────────
const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

async function sync() {
  try {
    const r = await fetch(API);
    const d = await r.json();

    if (d.faturamento) {
      let v = parseFloat(d.faturamento.replace(/[R$\s.]/g,'').replace(',','.')) || 0;
      updateRing('bDia','pDia','vDia', Math.min((v/954545)*100,100), d.faturamento);
    }
    if (d.faturamentoMes) {
      let vm = parseFloat(d.faturamentoMes.replace(/[R$\s.]/g,'').replace(',','.')) || 0;
      updateRing('bMes','pMes','vMes', Math.min((vm/21000000)*100,100), d.faturamentoMes);
    }

    if (d.veiculos) {
      renderPedidos(d.veiculos);
      renderFila(d.veiculos);
    }

    const now = new Date();
    document.getElementById('ultimaSync').textContent =
      `atualizado ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

  } catch(e) {
    console.error('Falha na atualização', e);
    document.getElementById('ultimaSync').textContent = 'falha na conexão';
  }
}

sync();
setInterval(sync, 15000);
</script>
