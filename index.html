<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPEDIÇÃO CD-84 | MONITOR TV 32"</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a; --panel: #0d1117; --accent: #58a6ff;
            --yellow: #d29922; --green: #3fb950; --border: rgba(255, 255, 255, 0.1);
            --text: #c9d1d9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        #meta-celebration {
            display: none;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: rainbow 1.5s linear infinite;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        @keyframes rainbow {
            0% { color: #ff0000; }
            20% { color: #ff00ff; }
            40% { color: #0000ff; }
            60% { color: #00ffff; }
            80% { color: #00ff00; }
            100% { color: #ffff00; }
        }

        .dashboard { 
            display: grid; 
            grid-template-columns: 140px 1fr 240px; 
            grid-template-rows: 50px 1fr; 
            height: 100vh; gap: 6px; padding: 6px; 
        }
        
        .header { grid-column: 1 / -1; background: var(--panel); border-radius: 6px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border: 1px solid var(--border); position: relative; }
        .header h1 { font-size: 1.1rem; font-weight: 900; }
        .header h1 span { color: var(--accent); }
        #clock-time { display: block; font-size: 1.2rem; font-weight: 900; color: var(--accent); }
        #clock-date { font-size: 0.6rem; color: #8b949e; text-transform: uppercase; margin-right: 10px; }

        .sidebar { grid-row: 2; background: var(--panel); border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 15px 5px; gap: 30px; }
        .indicator { width: 100%; text-align: center; }
        .ring-container { position: relative; width: 90px; height: 90px; margin: 0 auto; }
        svg { transform: rotate(-90deg); width: 90px; height: 90px; }
        circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .c-bg { stroke: rgba(255,255,255,0.05); }
        .c-bar { stroke-dasharray: 251; stroke-dashoffset: 251; transition: 1.5s ease; }
        .perc-txt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1rem; font-weight: 900; }
        .ind-label { font-size: 8px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 5px; }
        .ind-val { font-size: 0.75rem; font-weight: 800; margin-top: 2px; }

        .main-panel, .right-panel { grid-row: 2; background: var(--panel); border-radius: 6px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .panel-title { padding: 8px 12px; font-size: 0.7rem; font-weight: 800; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--accent); text-transform: uppercase; }
        .scroll-area { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { position: sticky; top: 0; background: #161b22; padding: 6px 4px; font-size: 9px; color: #8b949e; text-transform: uppercase; z-index: 10; border-bottom: 1px solid var(--border); }
        td { padding: 6px 4px; font-size: 12px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Estilos específicos da tabela de Pátio para espremer mais linhas */
        .right-panel td { padding: 4px 4px; font-size: 11px; } 
        .right-panel th { padding: 4px 4px; }

        .badge { padding: 3px 5px; border-radius: 3px; font-size: 9px; font-weight: 900; color: white; display: inline-block; width: 95%; text-transform: uppercase; }
        .vez-col { color: var(--yellow); font-size: 11px !important; width: 45px; }
        .placa-col { text-align: left !important; padding-left: 8px !important; color: #fff; font-size: 11px !important; }
        .doca-col { color: var(--yellow); font-size: 14px !important; font-weight: 900; }
        .valor-col { color: var(--green); font-size: 11px !important; }

        .abastecimento { background-color: #f7e092; color: #5c4b14; }
        .eletro { background-color: #0b723b; }
        .mateus-plus { background-color: #a30000; }
        .transferencia { background-color: #004d99; }
        .default-setor { background-color: #21262d; }

        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="meta-celebration">🚀 META DE 1 MILHÃO ATINGIDA! 🚀</div>

    <div class="dashboard">
        <header class="header">
            <h1>EXPEDIÇÃO <span>CD-84</span></h1>
            <div><span id="clock-date">--/--/----</span><span id="clock-time">00:00:00</span></div>
        </header>

        <aside class="sidebar">
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="45" cy="45" r="40"></circle><circle class="c-bar" id="bDia" cx="45" cy="45" r="40"></circle></svg>
                    <div class="perc-txt" id="pDia">0%</div>
                </div>
                <p class="ind-label">Hoje</p>
                <div class="ind-val" id="vDia">R$ 0,00</div>
            </div>
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="45" cy="45" r="40"></circle><circle class="c-bar" id="bMes" cx="45" cy="45" r="40"></circle></svg>
                    <div class="perc-txt" id="pMes">0%</div>
                </div>
                <p class="ind-label">Mês (21M)</p>
                <div class="ind-val" id="vMes">R$ 0,00</div>
            </div>
        </aside>

        <main class="main-panel">
            <div class="panel-title">Carregamentos Ativos</div>
            <div class="scroll-area">
                <table>
                    <colgroup><col width="100"><col><col width="80"><col width="110"><col width="90"></colgroup>
                    <thead><tr><th>Setor</th><th>Filial</th><th>Doca</th><th>Valor</th><th>Veículo</th></tr></thead>
                    <tbody id="corpoPedidos"></tbody>
                </table>
            </div>
        </main>

        <aside class="right-panel">
            <div class="panel-title">Pátio / Fila</div>
            <div class="scroll-area" id="scrollPatio">
                <table>
                    <colgroup><col width="45"><col width="100"><col></colgroup>
                    <thead><tr><th>Vez</th><th>Placa</th><th>Cub.</th></tr></thead>
                    <tbody id="corpoFila"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";
        let somTocado = false;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-br');
            document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-br', { weekday: 'short', day: '2-digit', month: 'short' });
        }
        setInterval(updateClock, 1000);

        function updateRing(barId, percId, valId, percent, valStr) {
            const bar = document.getElementById(barId);
            const circ = 251; 
            const offset = circ - (Math.min(percent, 100) / 100 * circ);
            bar.style.strokeDasharray = circ;
            bar.style.strokeDashoffset = offset;
            bar.style.stroke = percent < 50 ? "#da3633" : percent < 90 ? "#d29922" : "#3fb950";
            document.getElementById(percId).innerText = Math.round(percent) + "%";
            document.getElementById(valId).innerText = valStr;
        }

        // Sistema de Rolagem Automática para Fila Grande
        function startAutoscroll() {
            const container = document.getElementById('scrollPatio');
            clearInterval(window.patioScrollInterval);
            
            window.patioScrollInterval = setInterval(() => {
                if (container.scrollTop + container.clientHeight >= container.scrollHeight) {
                    container.scrollTop = 0; // Volta pro topo se chegou no fim
                } else {
                    container.scrollTop += 25; // Desce um pouco
                }
            }, 3000); // Executa a cada 3 segundos
        }

        async function sync() {
            try {
                const r = await fetch(API);
                const d = await r.json();

                if(d.faturamento) {
                    let v = parseFloat(d.faturamento.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bDia', 'pDia', 'vDia', (v/954545)*100, d.faturamento);

                    const celebrationEl = document.getElementById('meta-celebration');
                    if (v >= 1000000) {
                        celebrationEl.style.display = 'block';
                    } else {
                        celebrationEl.style.display = 'none';
                    }
                }
                
                if(d.faturamentoMes) {
                    let vm = parseFloat(d.faturamentoMes.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bMes', 'pMes', 'vMes', (vm/21000000)*100, d.faturamentoMes);
                }

                let hP = ""; let hF = "";

                if (d.veiculos) {
                    d.veiculos.forEach(v => {
                        const doca = String(v.doca || v.DOCA || "").trim();
                        const vez = String(v.vez || v.VEZ || "").trim();
                        const pFat = String(v.veiculos || v.VEICULO || "").trim();
                        const pPatio = String(v['PATIO CD'] || v.patio || "").trim();

                        if (doca && doca !== "0" && doca !== "DOCA" && doca !== "---") {
                            const setor = (v.tipo || v.setor || "---").toUpperCase();
                            let cls = "default-setor";
                            if(setor.includes("ABAST")) cls="abastecimento";
                            else if(setor.includes("ELETRO")) cls="eletro";
                            else if(setor.includes("MATEUS")) cls="mateus-plus";
                            else if(setor.includes("TRANSF")) cls="transferencia";

                            hP += `<tr>
                                <td><span class="badge ${cls}">${setor}</span></td>
                                <td>${v.filial || '-'}</td>
                                <td class="doca-col">${doca}</td>
                                <td class="valor-col">${v.valor || '---'}</td>
                                <td>${pFat || '---'}</td>
                            </tr>`;
                        }

                        if (vez && vez !== "0" && vez !== "VEZ") {
                            hF += `<tr>
                                <td class="vez-col">${vez}º</td>
                                <td class="placa-col">${pPatio || '---'}</td>
                                <td style="font-size:10px; color:#8b949e">${v.cubagem || v.CUBAGEM || '---'}</td>
                            </tr>`;
                        }
                    });
                }

                document.getElementById('corpoPedidos').innerHTML = hP || "<tr><td colspan='5'>SEM CARREGAMENTOS</td></tr>";
                document.getElementById('corpoFila').innerHTML = hF || "<tr><td colspan='3'>PÁTIO VAZIO</td></tr>";

                // Inicia a rolagem se houver muitos registros
                startAutoscroll();

            } catch (e) { console.error(e); }
        }

        sync();
        setInterval(sync, 15000);
    </script>
</body>
</html>
