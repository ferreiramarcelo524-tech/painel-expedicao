<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL CD-84 EXPEDIÇÃO</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { 
            width: 170px; 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 0; 
            background: #050505;
            flex-shrink: 0;
        }
        
        .sidebar h2 { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }

        /* Container fixo para garantir que tudo fique no mesmo eixo */
        .gauge-wrapper {
            position: relative;
            width: 170px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Força os SVGs do Google a ficarem centralizados */
        #chart_diario, #chart_mensal {
            display: flex;
            justify-content: center;
            width: 170px;
        }

        .label-gauge { 
            font-size: 8px; 
            color: #444; 
            text-transform: uppercase; 
            text-align: center;
            margin-top: -5px;
            margin-bottom: 5px;
        }
        
        #fat_txt, #fat_mes_txt { font-weight: bold; text-align: center; width: 100%; }
        #fat_txt { color: #2ecc71; font-size: 1.1rem; }
        #fat_mes_txt { color: #3498db; font-size: 0.95rem; }

        hr { width: 60%; border: 0; border-top: 1px solid #222; margin: 15px 0; }

        /* Principal */
        .main { flex: 1; overflow-y: auto; background: #000; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: #00428a; color: #fff; font-size: 9px; padding: 10px 2px; position: sticky; top: 0; text-transform: uppercase; border-bottom: 1px solid #333; z-index: 10; }
        td { border-bottom: 1px solid #1a1a1a; padding: 6px 2px; text-align: center; font-size: 12px; font-weight: bold; }
        tr:nth-child(even) { background: #080808; }
        .col-patio { color: #3498db; font-size: 14px; }
        .col-doca { color: #f1c40f; font-size: 13px; }
        .col-valor { color: #2ecc71; font-size: 11px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CD-84 MATEUS</h2>
        
        <div class="gauge-wrapper">
            <div id="chart_diario" style="height: 140px;"></div>
            <p class="label-gauge">Faturamento Atual</p>
            <div id="fat_txt">R$ 0,00</div>
        </div>

        <hr>

        <div class="gauge-wrapper">
            <div id="chart_mensal" style="height: 105px;"></div>
            <p class="label-gauge">Faturamento Mês (21M)</p>
            <div id="fat_mes_txt">R$ 0,00</div>
        </div>
    </div>

    <div class="main">
        <table>
            <thead>
                <tr>
                    <th style="width: 14%">TIPO</th>
                    <th style="width: 8%">FIL</th>
                    <th style="width: 8%">DOCA</th>
                    <th style="width: 12%">VALOR</th>
                    <th style="width: 10%">VEIC</th>
                    <th style="width: 12%">DATA</th>
                    <th style="width: 6%">VEZ</th>
                    <th style="width: 18%">PATIO</th>
                    <th style="width: 12%">CUB</th>
                </tr>
            </thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <script>
        const LINK_API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        google.charts.load('current', {'packages':['gauge']});
        google.charts.setOnLoadCallback(iniciar);

        let chartD, chartM, dataD, dataM, optD, optM;

        function iniciar() {
            chartD = new google.visualization.Gauge(document.getElementById('chart_diario'));
            dataD = google.visualization.arrayToDataTable([['Label', 'Value'],['%', 0]]);
            optD = { width: 140, height: 140, redFrom: 0, redTo: 50, yellowFrom: 50, yellowTo: 85, greenFrom: 85, greenTo: 100, minorTicks: 5 };

            chartM = new google.visualization.Gauge(document.getElementById('chart_mensal'));
            dataM = google.visualization.arrayToDataTable([['Label', 'Value'],['%', 0]]);
            // Reduzi levemente a largura interna para garantir que o Google centralize no eixo
            optM = { width: 100, height: 100, redFrom: 0, redTo: 50, yellowFrom: 50, yellowTo: 85, greenFrom: 85, greenTo: 100, minorTicks: 5 };
            
            atualizar();
            setInterval(atualizar, 15000); 
        }

        function n(v) {
            if (!v) return 0;
            return parseFloat(v.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
        }

        async function atualizar() {
            try {
                const r = await fetch(LINK_API);
                const j = await r.json();
                
                document.getElementById('fat_txt').innerText = j.faturamento;
                let pD = Math.round((n(j.faturamento) / (j.meta || 950000)) * 100);
                dataD.setValue(0, 1, pD > 100 ? 100 : pD);
                chartD.draw(dataD, optD);

                if(j.faturamentoMes) {
                    document.getElementById('fat_mes_txt').innerText = j.faturamentoMes;
                    let pM = Math.round((n(j.faturamentoMes) / 21000000) * 100);
                    dataM.setValue(0, 1, pM > 100 ? 100 : pM);
                    chartM.draw(dataM, optM);
                }

                const b = document.getElementById('tabelaBody');
                b.innerHTML = "";
                if (j.veiculos) {
                    j.veiculos.forEach(v => {
                        const row = b.insertRow();
                        let c = "#fff";
                        let t = v.tipo.toUpperCase();
                        if(t.includes("ABASTECIMENTO")) c = "#f39c12";
                        else if(t.includes("ELETRO")) c = "#2ecc71";
                        else if(t !== "") c = "#dc3545";

                        row.innerHTML = `
                            <td style="color:${c}">${v.tipo}</td>
                            <td>${v.filial}</td>
                            <td class="col-doca">${v.doca}</td>
                            <td class="col-valor">${v.valor}</td>
                            <td>${v.veiculos}</td>
                            <td style="color:#666; font-size:10px">${v.data}</td>
                            <td>${v.vez}</td>
                            <td class="col-patio">${v.patio}</td>
                            <td>${v.cubagem}</td>
                        `;
                    });
                }
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
