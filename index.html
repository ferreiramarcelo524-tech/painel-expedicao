<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedição CD-84 - Oficial</title>
    
    <style>
        /* CONFIGURAÇÕES DE CORES E FUNDO */
        :root {
            --cor-mateus: #2ecc71;
            --cor-doca: #f1c40f;
            --cor-fundo: #000000;
            --cor-tabela: #111111;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--cor-fundo);
            color: white;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }

        /* CABEÇALHO E MEDIDOR */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--cor-mateus);
        }

        #medidor-mensal {
            text-align: center;
            padding: 10px 20px;
            border: 2px solid var(--cor-mateus);
            border-radius: 10px;
            background: rgba(46, 204, 113, 0.05);
        }

        .valor-meta {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--cor-mateus);
        }

        /* TABELA COM CORREÇÃO DE SOBREPOSIÇÃO */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--cor-tabela);
            table-layout: fixed; /* ESSENCIAL: Mantém as colunas no lugar */
        }

        th {
            background-color: #003366; /* Azul do seu cabeçalho original */
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #222;
            font-size: 1.1rem;
            font-weight: bold;
            
            /* CORREÇÃO DO TEXTO SOBREPOSTO */
            white-space: nowrap;       /* Não deixa o texto quebrar linha */
            overflow: hidden;          /* Esconde o que sobra */
            text-overflow: ellipsis;   /* Coloca os "..." se for muito grande */
        }

        /* DEFINIÇÃO DE LARGURA DAS COLUNAS */
        .col-tipo { width: 22%; color: var(--cor-mateus); }
        .col-fil  { width: 30%; }
        .col-doca { width: 20%; color: var(--cor-doca); }
        .col-valor{ width: 18%; }
        .col-btn  { width: 10%; }

        .btn-finalizar {
            background-color: var(--cor-mateus);
            color: black;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
        }

        /* ANIMAÇÃO DE PARTÍCULAS */
        .particula-faturamento {
            position: fixed;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #2ecc71, #27ae60);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            transition: left 1.2s cubic-bezier(0.42, 0, 0.58, 1), 
                        top 1.2s cubic-bezier(0.42, 0, 0.58, 1), 
                        transform 1.2s, opacity 1.2s;
        }

        .linha-expedida {
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.7s ease-in;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2 style="margin:0; color:var(--cor-mateus);">EXPEDIÇÃO CD-84</h2>
            <span style="font-size: 0.8rem; color: #888;">LOGÍSTICA MATEUS</span>
        </div>
        <div id="medidor-mensal">
            <div style="font-size: 0.7rem;">ACUMULADO MENSAL</div>
            <div class="valor-meta" id="display-mensal">R$ 15.420.000,00</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th class="col-tipo">Tipo</th>
                <th class="col-fil">Fil</th>
                <th class="col-doca">Doca</th>
                <th class="col-valor">Valor</th>
                <th class="col-btn"></th>
            </tr>
        </thead>
        <tbody id="tabela-corpo">
            <tr id="linha-1">
                <td class="col-tipo">ABASTECIMENTO</td>
                <td class="col-fil">LOJA 632 - MARABÁ</td>
                <td class="col-doca">DOCA 20</td>
                <td class="col-valor">R$ 15.000</td>
                <td class="col-btn"><button class="btn-finalizar" onclick="processarCarga('linha-1')">OK</button></td>
            </tr>
            <tr id="linha-2">
                <td class="col-tipo">ELETRO</td>
                <td class="col-fil">PARAGOMINAS - CENTRO</td>
                <td class="col-doca">DOCA 13</td>
                <td class="col-valor">R$ 42.800</td>
                <td class="col-btn"><button class="btn-finalizar" onclick="processarCarga('linha-2')">OK</button></td>
            </tr>
        </tbody>
    </table>

    <script>
        function processarCarga(idLinha) {
            dispararAnimacao(idLinha, 'medidor-mensal');
        }

        function dispararAnimacao(idLinha, idDestino) {
            const linha = document.getElementById(idLinha);
            const destino = document.getElementById(idDestino);
            const rectOrigem = linha.getBoundingClientRect();
            const rectDestino = destino.getBoundingClientRect();

            linha.classList.add('linha-expedida');

            const quantidade = 50; // Quantidade aumentada conforme solicitado

            for (let i = 0; i < quantidade; i++) {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.className = 'particula-faturamento';
                    
                    // Saída da linha
                    const startX = rectOrigem.left + rectOrigem.width / 2 + (Math.random() - 0.5) * 50;
                    const startY = rectOrigem.top + rectOrigem.height / 2;

                    p.style.left = startX + 'px';
                    p.style.top = startY + 'px';
                    p.style.transform = 'scale(1)';
                    
                    document.body.appendChild(p);

                    setTimeout(() => {
                        // Voo até o medidor
                        p.style.left = (rectDestino.left + rectDestino.width / 2) + 'px';
                        p.style.top = (rectDestino.top + rectDestino.height / 2) + 'px';
                        p.style.transform = 'scale(0.1)';
                        p.style.opacity = '0';
                    }, 50);

                    setTimeout(() => p.remove(), 1400);
                }, i * 25);
            }

            setTimeout(() => { linha.style.display = 'none'; }, 800);
        }
    </script>
</body>
</html>
