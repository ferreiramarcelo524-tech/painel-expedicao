<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EXPEDIÇÃO CD-84 - PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #58a6ff;
            --red: #da3633;
            --yellow: #d29922;
            --green: #3fb950;
            --border: rgba(255, 255, 255, 0.08);
            --text: #c9d1d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* --- SIDEBAR DE METAS --- */
        .sidebar {
            width: 240px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 25px;
            align-items: center;
            flex-shrink: 0;
        }

        .brand { font-weight: 900; letter-spacing: 2px; font-size: 0.75rem; margin-bottom: 40px; opacity: 0.7; }

        .indicator-card { text-align: center; margin-bottom: 40px; position: relative; }
        
        .progress-ring { position: relative; width: 140px; height: 140px; }
        .progress-ring svg { transform: rotate(-90deg); width: 140px; height: 140px; }
        .progress-ring circle {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
        }
        .circle-bg { stroke: rgba(255,255,255,0.05); }
        .circle-bar { 
            stroke-dasharray: 440; 
            stroke-dashoffset: 440; 
            transition: stroke-dashoffset 1s ease, stroke 0.5s ease;
        }

        .percentage {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem; font-weight: 800;
            transition: color 0.5s ease;
        }

        .indicator-label { font-size: 10px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 15px; }
        .indicator-value { font-size: 1rem; font-weight: 800; margin-top: 5px; transition: color 0.5s ease; }

        .meta-tag { margin-top: auto; padding: 15px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; width: 100%; text-align: center; }
        .meta-tag small { font-size: 9px; color: #8b949e; display: block; margin-bottom: 4px; }
        .meta-tag b { font-size: 0.8rem; color: #fff; }

        /* --- CONTEÚDO CENTRAL --- */
        .main { flex: 1; display: flex; flex-direction: column; padding: 25px; gap: 20px; overflow: hidden; }
        
        .top-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .top-row h1 { font-size: 1.8rem; font-weight: 900; }
        .cub-total-box { text-align: right; }
        .cub-total-box span { font-size: 0.75rem; color: #8b949e; font-weight: 600; }
        .cub-total-box b { display: block; font-size: 1.3rem; color: var(--green); font-weight: 900; }

        .data-grid { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; flex: 1; }
        .grid-header { padding: 18px 25px; background: rgba(255,255,255,0.01); border-bottom: 1px solid var(--border); font-size: 0.9rem; font-weight: 800; color: var(--accent); }

        .table-area { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: #161b22; padding: 15px 10px; font-size: 10px; color: #8b949e; text-transform: uppercase; text-align: center; border-bottom: 1px solid var(--border); z-index: 2; }
        td { padding: 14px 10px; font-size: 12.5px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; }
        
        .badge-tipo { padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; border: 1px solid currentColor; }

        /* --- FILA LATERAL --- */
        .queue-sidebar { width: 320px; padding: 25px 25px 25px 0; flex-shrink: 0; }
        .queue-panel { height: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
        .queue-panel .grid-header { color: var(--yellow); }

        .vez-col { color: var(--yellow); font-size: 1.1rem; font-weight: 900; }
        .placa-col { color: var(--accent); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">CD-84 MATEUS</div>
        
        <div class="indicator-card">
            <div class="progress-ring">
                <svg><circle class="circle-bg" cx="70" cy="70" r="60"></circle><circle class="circle-bar" id="bar_dia" cx="70" cy="70" r="60"></circle></svg>
                <div class="percentage" id="perc_dia">0%</div>
            </div>
            <p class="indicator-label">Faturamento Hoje</p>
            <div class="indicator-value" id="val_dia">R$ 0,00</div>
        </div>

        <div class="indicator-card">
            <div class="progress-ring">
                <svg><circle class="circle-bg" cx="70" cy="70" r="60"></circle><circle class="circle-bar" id="bar_mes" cx="70" cy="70" r="60"></circle></svg>
                <div class="percentage" id="perc_mes">0%</div>
            </div>
            <p class="indicator-label">Meta Mensal (21M)</p>
            <div class="indicator-value" id="val_mes">R$ 0,00</div>
        </div>

        <div class="meta-tag">
            <small>META DIÁRIA OPERACIONAL</small>
            <b>R$ 954.545,45</b>
        </div>
    </aside>

    <main class="main">
        <div class="top-row">
            <h1>Controle de <span style="color:var(--accent)">Expedição</span></h1>
            <div class="cub-total-box">
                
             
            </div>
        </div>

        <section class="data-grid">
            <div class="grid-header">PEDIDOS EM CARREGAMENTO ATIVO</div>
            <div class="table-area">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 18%">Tipo</th>
                            <th style="width: 15%">Filial</th>
                            <th style="width: 12%">Doca</th>
                            <th style="width: 18%">Valor</th>
                            <th style="width: 20%">Veículo</th>
                            <th style="width: 17%">Horário</th>
                        </tr>
                    </thead>
                    <tbody id="corpoPedidos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <aside class="queue-sidebar">
        <div class="queue-panel">
            <div class="grid-header">ORDEM DE CHEGADA (PÁTIO)</div>
            <div class="table-area">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 25%">Vez</th>
                            <th style="width: 45%">Placa CD</th>
                            <th style="width: 30%">Cubagem</th>
                        </tr>
                    </thead>
                    <tbody id="corpoFila"></tbody>
                </table>
            </div>
        </div>
    </aside>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        function getColor(percent) {
            if (percent < 50) return "#da3633"; // Vermelho
            if (percent < 90) return "#d29922"; // Amarelo
            return "#3fb950"; // Verde
        }

        function updateRing(idBar, idPerc, idVal, percent, currentVal) {
            const circle = document.getElementById(idBar);
            const textPerc = document.getElementById(idPerc);
            const textVal = document.getElementById(idVal);
            const radius = circle.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;
            
            const color = getColor(percent);
            const offset = circumference - (percent / 100 * circumference);
            
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = offset;
            circle.style.stroke = color;
            
            textPerc.innerText = `${Math.round(percent)}%`;
            textPerc.style.color = color;
            textVal.innerText = currentVal;
            textVal.style.color = color;
        }

        async function fetchLogistics() {
            try {
                const res = await fetch(API);
                const data = await res.json();

                // 1. Atualizar Metas Dinâmicas
                if(data.faturamento) {
                    let vDia = parseFloat(data.faturamento.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bar_dia', 'perc_dia', 'val_dia', Math.min((vDia / 954545) * 100, 100), data.faturamento);
                }

                if(data.faturamentoMes) {
                    let vMes = parseFloat(data.faturamentoMes.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bar_mes', 'perc_mes', 'val_mes', Math.min((vMes / 21000000) * 100, 100), data.faturamentoMes);
                }

                // 2. Pedidos Ativos (Tabela Central)
                document.getElementById('corpoPedidos').innerHTML = data.veiculos.filter(v => v.doca && v.tipo).map(v => {
                    let c = v.tipo.includes("ABASTECIMENTO") ? "#f39c12" : v.tipo.includes("ELETRO") ? "#2ecc71" : "#da3633";
                    return `<tr>
                        <td><span class="badge-tipo" style="color:${c}">${v.tipo}</span></td>
                        <td>${v.filial}</td>
                        <td style="color:var(--yellow)">${v.doca}</td>
                        <td style="color:var(--green)">${v.valor}</td>
                        <td>${v.veiculos || '---'}</td>
                        <td style="color:#555">${v.data}</td>
                    </tr>`;
                }).join('');

                // 3. Ordem de Chegada (Tabela Direita)
                document.getElementById('corpoFila').innerHTML = data.veiculos.filter(v => v.vez || v.patio).map(v => `
                    <tr>
                        <td class="vez-col">${v.vez || '--'}</td>
                        <td class="placa-col">${v.patio || v.veiculos || '---'}</td>
                        <td style="color:#555">${v.cubagem || '0m³'}</td>
                    </tr>
                `).join('');

            } catch (err) { console.error("Erro na sincronização:", err); }
        }

        fetchLogistics();
        setInterval(fetchLogistics, 15000);
    </script>
</body>
</html>
