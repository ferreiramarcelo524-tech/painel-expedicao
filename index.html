<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPEDIÇÃO CD-84 | MONITOR OFICIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #58a6ff;
            --yellow: #d29922;
            --green: #3fb950;
            --border: rgba(255, 255, 255, 0.1);
            --text: #c9d1d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

        .dashboard {
            display: grid;
            grid-template-columns: 160px 1fr 260px; 
            grid-template-rows: 60px 1fr;
            height: 100vh;
            gap: 8px;
            padding: 8px;
        }

        .header {
            grid-column: 1 / -1;
            background: var(--panel);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border: 1px solid var(--border);
        }
        .header h1 { font-size: 1.3rem; font-weight: 900; }
        .header h1 span { color: var(--accent); }

        #clock-time { display: block; font-size: 1.4rem; font-weight: 900; color: var(--accent); line-height: 1; text-align: right;}
        #clock-date { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; }

        .sidebar {
            grid-row: 2;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column; 
            align-items: center;
            padding: 20px 10px;
            gap: 40px;
        }

        .indicator { width: 100%; text-align: center; }
        .ring-container { position: relative; width: 110px; height: 110px; margin: 0 auto; }
        svg { transform: rotate(-90deg); width: 110px; height: 110px; }
        circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .c-bg { stroke: rgba(255,255,255,0.05); }
        .c-bar { stroke-dasharray: 314; stroke-dashoffset: 314; transition: 1.5s ease; }
        .perc-txt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; font-weight: 900; }
        .ind-label { font-size: 8px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 6px; }
        .ind-val { font-size: 0.85rem; font-weight: 800; margin-top: 3px; }

        .main-panel, .right-panel {
            grid-row: 2;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title { padding: 10px 15px; font-size: 0.75rem; font-weight: 800; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); color: var(--accent); }
        .right-panel .panel-title { color: var(--yellow); }

        .scroll-area { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        
        .main-panel th { position: sticky; top: 0; background: #161b22; padding: 8px 5px; font-size: 9px; color: #8b949e; text-transform: uppercase; z-index: 10; border-bottom: 1px solid var(--border); }
        .main-panel td { padding: 6px 5px; font-size: 12px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; }

        .badge { padding: 3px 8px; border-radius: 5px; font-size: 9px; font-weight: 800; color: white; display: inline-block; }
        .abastecimento { background-color: #f7e092; color: #5c4b14; }
        .eletro { background-color: #0b723b; }
        .mateus-plus { background-color: #a30000; }
        .transferencia { background-color: #004d99; }
        .compl-extra { background-color: #b3d9ff; color: #004d99; }
        .retirada { background-color: #4b2c73; }
        .almoxarifado { background-color: #733b00; }
        .retorno { background-color: #0059b3; }
        .clientes-extras { background-color: #593380; }
        .ponta-estoque { background-color: #b3d9ff; color: #004d99; }
        .default-setor { background-color: #21262d; color: #c9d1d9; }

        .right-panel th { position: sticky; top: 0; background: #161b22; padding: 6px 2px; font-size: 8px; color: #8b949e; text-transform: uppercase; z-index: 10; }
        .right-panel td { 
            padding: 4px 2px !important; 
            font-size: 11px !important; 
            border-bottom: 1px solid rgba(255,255,255,0.05) !important;
            text-align: center;
            font-weight: 700;
        }
        .vez-col { color: var(--yellow); font-size: 13px !important; width: 35px; }
        .placa-col { text-align: left !important; padding-left: 5px !important; color: var(--accent); }
        .cub-col { color: #666; font-size: 10px !important; width: 55px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="header">
            <h1>EXPEDIÇÃO <span>CD-84</span></h1>
            <div id="clock-container">
                <span id="clock-date">--/--/----</span>
                <span id="clock-time">00:00:00</span>
            </div>
        </header>

        <aside class="sidebar">
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="55" cy="55" r="50"></circle><circle class="c-bar" id="bDia" cx="55" cy="55" r="50"></circle></svg>
                    <div class="perc-txt" id="pDia">0%</div>
                </div>
                <p class="ind-label">Faturamento Hoje</p>
                <div class="ind-val" id="vDia">R$ 0,00</div>
            </div>
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="55" cy="55" r="50"></circle><circle class="c-bar" id="bMes" cx="55" cy="55" r="50"></circle></svg>
                    <div class="perc-txt" id="pMes">0%</div>
                </div>
                <p class="ind-label">Faturamento Mês</p>
                <div class="ind-val" id="vMes">R$ 0,00</div>
            </div>
        </aside>

        <main class="main-panel">
            <div class="panel-title">PEDIDOS EM CARREGAMENTO</div>
            <div class="scroll-area">
                <table>
                    <thead>
                        <tr><th>Setor</th><th>Filial</th><th>Doca</th><th>Valor</th><th>Veículo</th></tr>
                    </thead>
                    <tbody id="corpoPedidos"></tbody>
                </table>
            </div>
        </main>

        <aside class="right-panel">
            <div class="panel-title">ORDEM DE CHEGADA</div>
            <div class="scroll-area">
                <table>
                    <thead>
                        <tr><th style="width:35px">Vez</th><th>Placa / Pátio</th><th style="width:55px">Cub.</th></tr>
                    </thead>
                    <tbody id="corpoFila"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-br');
            document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-br', { weekday: 'short', day: '2-digit', month: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getSectorStyle(sector) {
            const s = String(sector || "").toUpperCase();
            if (s.includes("ABASTECIMENTO")) return "abastecimento";
            if (s.includes("ELETRO")) return "eletro";
            if (s.includes("MATEUS") || s.includes("PLUS")) return "mateus-plus";
            if (s.includes("TRANSFERENCIA")) return "transferencia";
            if (s.includes("COMPL") || s.includes("EXTRA")) return "compl-extra";
            if (s.includes("RETIRADA")) return "retirada";
            if (s.includes("ALMOXARIFADO")) return "almoxarifado";
            if (s.includes("RETORNO") || s.includes("ASSISTENCIA")) return "retorno";
            if (s.includes("CLIENTE")) return "clientes-extras";
            if (s.includes("PONTA") || s.includes("ESTOQUE")) return "ponta-estoque";
            return "default-setor";
        }

        function updateRing(barId, percId, valId, percent, valStr) {
            const bar = document.getElementById(barId);
            const circ = 314; 
            const offset = circ - (percent / 100 * circ);
            const color = percent < 50 ? "#da3633" : percent < 90 ? "#d29922" : "#3fb950";
            bar.style.strokeDasharray = circ;
            bar.style.strokeDashoffset = offset;
            bar.style.stroke = color;
            document.getElementById(percId).innerText = Math.round(percent) + "%";
            document.getElementById(percId).style.color = color;
            document.getElementById(valId).innerText = valStr;
        }

        async function sync() {
            try {
                const r = await fetch(API);
                const d = await r.json();

                if(d.faturamento) {
                    let v = parseFloat(d.faturamento.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bDia', 'pDia', 'vDia', Math.min((v/954545)*100, 100), d.faturamento);
                }
                if(d.faturamentoMes) {
                    let vm = parseFloat(d.faturamentoMes.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bMes', 'pMes', 'vMes', Math.min((vm/21000000)*100, 100), d.faturamentoMes);
                }

                if (!d.veiculos) return;

                // 1. FILTRAR QUEM ESTÁ EM CARREGAMENTO (Tem doca válida)
                const emCarregamento = d.veiculos.filter(v => {
                    const doca = String(v.doca || v.DOCA || "").trim();
                    return doca !== "" && doca !== "0" && doca !== "---" && doca !== "-";
                });

                document.getElementById('corpoPedidos').innerHTML = emCarregamento.map(v => {
                    const setor = v.tipo || v.setor || v.SETOR || "---";
                    return `<tr>
                        <td><span class="badge ${getSectorStyle(setor)}">${setor}</span></td>
                        <td>${v.filial || '-'}</td>
                        <td style="color:var(--yellow); font-size:14px">${v.doca}</td>
                        <td style="color:var(--green)">${v.valor || '---'}</td>
                        <td style="font-size:11px">${v.veiculos || '---'}</td>
                    </tr>`;
                }).join('');

                // 2. FILTRAR ORDEM DE CHEGADA (Tem vez e placa, mas NÃO tem doca)
                const corpoFila = document.getElementById('corpoFila');
                let htmlFila = "";
                
                d.veiculos.forEach(v => {
                    const vez = v.vez || v.VEZ;
                    const placa = v['PATIO CD'] || v.patio || v.veiculos;
                    const doca = String(v.doca || v.DOCA || "").trim();

                    // SÓ ADICIONA NA FILA SE: Tiver placa/vez E a doca estiver vazia ou for 0/---
                    const estaNaFila = (doca === "" || doca === "0" || doca === "---" || doca === "-");

                    if (vez && placa && placa !== "---" && estaNaFila) {
                        htmlFila += `<tr>
                            <td class="vez-col">${vez}</td>
                            <td class="placa-col">${placa}</td>
                            <td class="cub-col">${v.cubagem || '---'}</td>
                        </tr>`;
                    }
                });

                corpoFila.innerHTML = htmlFila || "<tr><td colspan='3' style='padding:20px; opacity:0.5;'>PÁTIO VAZIO</td></tr>";

            } catch (e) { console.error(e); }
        }

        sync();
        setInterval(sync, 15000);
    </script>
</body>
</html>
