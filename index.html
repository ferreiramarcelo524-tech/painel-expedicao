<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EXPEDIÇÃO CD-84 - MÁXIMA DENSIDADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #58a6ff;
            --red: #da3633;
            --yellow: #d29922;
            --green: #3fb950;
            --border: rgba(255, 255, 255, 0.1);
            --text: #c9d1d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        .dashboard {
            display: grid;
            grid-template-columns: 150px 1fr 260px; 
            grid-template-rows: 60px 1fr;
            height: 100vh;
            gap: 8px;
            padding: 8px;
        }

        .header {
            grid-column: 1 / -1;
            background: var(--panel);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border: 1px solid var(--border);
        }
        .header h1 { font-size: 1.2rem; font-weight: 900; }
        .header h1 span { color: var(--accent); }

        #clock-container { text-align: right; }
        #clock-time { display: block; font-size: 1.3rem; font-weight: 900; color: var(--accent); line-height: 1; }
        #clock-date { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; }

        .sidebar {
            grid-row: 2;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start;
            padding: 20px 5px;
            gap: 40px;
        }

        .indicator { width: 100%; text-align: center; }
        .ring-container { position: relative; width: 110px; height: 110px; margin: 0 auto; }
        svg { transform: rotate(-90deg); width: 110px; height: 110px; }
        circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .c-bg { stroke: rgba(255,255,255,0.05); }
        .c-bar { stroke-dasharray: 314; stroke-dashoffset: 314; transition: 1s ease; }
        
        .perc-txt { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.1rem; font-weight: 900; }
        .ind-label { font-size: 8px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 5px; }
        .ind-val { font-size: 0.85rem; font-weight: 800; margin-top: 2px; }

        .main-panel {
            grid-row: 2;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-title { padding: 8px 12px; font-size: 0.75rem; font-weight: 800; border-bottom: 1px solid var(--border); color: var(--accent); background: rgba(255,255,255,0.02); }
        .scroll-area { flex: 1; overflow-y: auto; }
        
        table { width: 100%; border-collapse: collapse; }
        th { position: sticky; top: 0; background: #161b22; padding: 8px 4px; font-size: 9px; color: #8b949e; text-transform: uppercase; z-index: 10; border-bottom: 2px solid var(--border); }
        td { padding: 6px 4px; font-size: 11px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; line-height: 1.1; }

        .right-panel {
            grid-row: 2;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .right-panel .panel-title { color: var(--yellow); }
        .badge { padding: 2px 5px; border-radius: 3px; font-size: 8px; border: 1px solid currentColor; font-weight: 800; }
    </style>
</head>
<body>

    <div class="dashboard">
        <header class="header">
            <h1>EXPEDIÇÃO <span>CD-84</span></h1>
            <div id="clock-container">
                <span id="clock-date">--/--/----</span>
                <span id="clock-time">00:00:00</span>
            </div>
        </header>

        <aside class="sidebar">
            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="55" cy="55" r="50"></circle><circle class="c-bar" id="bDia" cx="55" cy="55" r="50"></circle></svg>
                    <div class="perc-txt" id="pDia">0%</div>
                </div>
                <p class="ind-label">Faturamento Hoje</p>
                <div class="ind-val" id="vDia">R$ 0,00</div>
            </div>

            <div class="indicator">
                <div class="ring-container">
                    <svg><circle class="c-bg" cx="55" cy="55" r="50"></circle><circle class="c-bar" id="bMes" cx="55" cy="55" r="50"></circle></svg>
                    <div class="perc-txt" id="pMes">0%</div>
                </div>
                <p class="ind-label">Faturamento Mês</p>
                <div class="ind-val" id="vMes">R$ 0,00</div>
            </div>
        </aside>

        <main class="main-panel">
            <div class="panel-title">PEDIDOS EM CARREGAMENTO</div>
            <div class="scroll-area">
                <table>
                    <thead>
                        <tr>
                            <th>Setor</th>
                            <th>Filial</th>
                            <th>Doca</th>
                            <th>Valor</th>
                            <th>Veículo</th>
                            <th>Hora</th>
                        </tr>
                    </thead>
                    <tbody id="corpoPedidos"></tbody>
                </table>
            </div>
        </main>

        <aside class="right-panel">
            <div class="panel-title">ORDEM DE CHEGADA (PÁTIO CD)</div>
            <div class="scroll-area">
                <table>
                    <thead>
                        <tr>
                            <th>Vez</th>
                            <th>Placa</th>
                            <th>Cub.</th>
                        </tr>
                    </thead>
                    <tbody id="corpoFila"></tbody>
                </table>
            </div>
        </aside>
    </div>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        function updateClock() {
            const now = new Date();
            document.getElementById('clock-time').textContent = now.toLocaleTimeString('pt-br');
            document.getElementById('clock-date').textContent = now.toLocaleDateString('pt-br', { weekday: 'short', day: '2-digit', month: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function updateRing(barId, percId, valId, percent, valStr) {
            const bar = document.getElementById(barId);
            const circ = 2 * Math.PI * 50; 
            const offset = circ - (percent / 100 * circ);
            const color = percent < 50 ? "#da3633" : percent < 90 ? "#d29922" : "#3fb950";
            bar.style.strokeDasharray = circ;
            bar.style.strokeDashoffset = offset;
            bar.style.stroke = color;
            document.getElementById(percId).innerText = Math.round(percent) + "%";
            document.getElementById(percId).style.color = color;
            document.getElementById(valId).innerText = valStr;
            document.getElementById(valId).style.color = color;
        }

        async function sync() {
            try {
                const r = await fetch(API);
                const d = await r.json();

                // Faturamento
                if(d.faturamento) {
                    let v = parseFloat(d.faturamento.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bDia', 'pDia', 'vDia', Math.min((v/954545)*100, 100), d.faturamento);
                }
                if(d.faturamentoMes) {
                    let vm = parseFloat(d.faturamentoMes.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateRing('bMes', 'pMes', 'vMes', Math.min((vm/21000000)*100, 100), d.faturamentoMes);
                }

                // PEDIDOS EM CARREGAMENTO (Quem tem Doca)
                const emCarregamento = d.veiculos.filter(v => {
                    const doca = String(v.doca || "").trim();
                    return doca !== "" && doca !== "0" && doca !== "---";
                });

                document.getElementById('corpoPedidos').innerHTML = emCarregamento.map(v => {
                    const tipo = v.tipo || v.setor || "---";
                    const corSetor = tipo.includes("ABASTECIMENTO") ? "#f39c12" : tipo.includes("ELETRO") ? "#2ecc71" : "#da3633";
                    return `<tr>
                        <td><span class="badge" style="color:${corSetor}">${tipo}</span></td>
                        <td>${v.filial || '---'}</td>
                        <td style="color:var(--yellow)">${v.doca}</td>
                        <td style="color:var(--green)">${v.valor || 'R$ 0,00'}</td>
                        <td>${v.veiculos || '---'}</td>
                        <td style="color:#555; font-size:9px">${v.data || '---'}</td>
                    </tr>`;
                }).join('');

                // ORDEM DE CHEGADA (Quem NÃO tem Doca e tem alguma identificação)
                const naFila = d.veiculos.filter(v => {
                    const doca = String(v.doca || "").trim();
                    const semDoca = (doca === "" || doca === "0" || doca === "---");
                    const temInfo = (v.veiculos || v.vez || v.Vez || v.patio || v.placa);
                    return semDoca && temInfo;
                });

                document.getElementById('corpoFila').innerHTML = naFila.map(v => `
                    <tr>
                        <td style="color:var(--yellow); font-size:1rem">${v.vez || v.Vez || '--'}</td>
                        <td style="color:var(--accent)">${v.veiculos || v.placa || v.patio || '---'}</td>
                        <td style="color:#666">${v.cubagem || v.Cubagem || '0m³'}</td>
                    </tr>
                `).join('');

            } catch (e) { console.error("Erro na atualização", e); }
        }

        sync();
        setInterval(sync, 15000);
    </script>
</body>
</html>
