<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL CD-84 EXPEDIÇÃO</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { 
            width: 170px; 
            border-right: 1px solid #333; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 0; 
            background: #050505;
            flex-shrink: 0;
        }
        
        .sidebar h2 { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }

        .gauge-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .chart-box {
            width: 170px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .label-gauge { 
            font-size: 8px; 
            color: #444; 
            text-transform: uppercase; 
            text-align: center;
            margin-top: -5px;
            margin-bottom: 5px;
        }
        
        #fat_txt, #fat_mes_txt { font-weight: bold; text-align: center; width: 100%; }
        #fat_txt { color: #2ecc71; font-size: 1.1rem; }
        #fat_mes_txt { color: #3498db; font-size: 0.95rem; }

        hr { width: 60%; border: 0; border-top: 1px solid #222; margin: 15px 0; }

        .main { flex: 1; overflow-y: auto; background: #000; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: #00428a; color: #fff; font-size: 9px; padding: 10px 2px; position: sticky; top: 0; text-transform: uppercase; border-bottom: 1px solid #333; z-index: 10; }
        td { border-bottom: 1px solid #1a1a1a; padding: 6px 2px; text-align: center; font-size: 12px; font-weight: bold; }
        tr:nth-child(even) { background: #080808; }
        
        .col-patio { color: #3498db; font-size: 14px; }
        .col-doca { color: #f1c40f; font-size: 13px; }
        .col-valor { color: #2ecc71; font-size: 11px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CD-84 MATEUS</h2>
        
        <div class="gauge-wrapper">
            <div class="chart-box" id="chart_diario" style="height: 140px;"></div>
            <p class="label-gauge">Faturamento Atual</p>
            <div id="fat_txt">R$ 0,00</div>
        </div>

        <hr>

        <div class="gauge-wrapper">
            <div class="chart-box" id="chart_mensal" style="height: 140px;"></div>
            <p class="label-gauge">Faturamento Mês (21M)</p>
            <div id="fat_mes_txt">R$ 0,00</div>
        </div>
    </div>

    <div class="main">
        <table>
            <thead>
                <tr>
                    <th style="width: 14%">TIPO</th>
                    <th style="width: 8%">FIL</th>
                    <th style="width: 8%">DOCA</th>
                    <th style="width: 12%">VALOR</th>
                    <th style="width: 10%">VEIC</th>
                    <th style="width: 12%">DATA</th>
                    <th style="width: 6%">VEZ</th>
                    <th style="width: 18%">PATIO</th>
                    <th style="width: 12%">CUB</th>
                </tr>
            </thead>
            <tbody id="tabelaBody"></tbody>
        </table>
    </div>

    <script>
        const LINK_API = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        google.charts.load('current', {'packages':['gauge']});
        google.charts.setOnLoadCallback(iniciar);

        let chartD, chartM, dataD, dataM;
        let opt = { width: 140, height: 140, redFrom: 0, redTo: 50, yellowFrom: 50, yellowTo: 85, greenFrom: 85, greenTo: 100, minorTicks: 5 };

        function iniciar() {
            try {
                chartD = new google.visualization.Gauge(document.getElementById('chart_diario'));
                dataD = google.visualization.arrayToDataTable([['Label', 'Value'],['%', 0]]);

                chartM = new google.visualization.Gauge(document.getElementById('chart_mensal'));
                dataM = google.visualization.arrayToDataTable([['Label', 'Value'],['%', 0]]);
                
                atualizar();
                setInterval(atualizar, 15000);
            } catch (e) { console.error("Erro na inicialização:", e); }
        }

        function converterParaNumero(valor) {
            if (!valor || typeof valor !== 'string') return 0;
            return parseFloat(valor.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
        }

        async function atualizar() {
            try {
                const response = await fetch(LINK_API);
                const dados = await response.json();
                
                // Atualiza Gráfico Diário
                if(dados.faturamento) {
                    document.getElementById('fat_txt').innerText = dados.faturamento;
                    let numD = converterParaNumero(dados.faturamento);
                    let percD = Math.round((numD / (dados.meta || 950000)) * 100);
                    dataD.setValue(0, 1, Math.min(percD, 100));
                    chartD.draw(dataD, opt);
                }

                // Atualiza Gráfico Mensal
                if(dados.faturamentoMes) {
                    document.getElementById('fat_mes_txt').innerText = dados.faturamentoMes;
                    let numM = converterParaNumero(dados.faturamentoMes);
                    let percM = Math.round((numM / 21000000) * 100);
                    dataM.setValue(0, 1, Math.min(percM, 100));
                    chartM.draw(dataM, opt);
                }

                // Atualiza Tabela
                const tabelaBody = document.getElementById('tabelaBody');
                if (dados.veiculos && Array.isArray(dados.veiculos)) {
                    let conteudoHtml = "";
                    dados.veiculos.forEach(v => {
                        let corTipo = "#fff";
                        let tipoTexto = (v.tipo || "").toUpperCase();
                        if(tipoTexto.includes("ABASTECIMENTO")) corTipo = "#f39c12";
                        else if(tipoTexto.includes("ELETRO")) corTipo = "#2ecc71";
                        else if(tipoTexto !== "") corTipo = "#dc3545";

                        conteudoHtml += `<tr>
                            <td style="color:${corTipo}">${v.tipo || ""}</td>
                            <td>${v.filial || ""}</td>
                            <td class="col-doca">${v.doca || ""}</td>
                            <td class="col-valor">${v.valor || ""}</td>
                            <td>${v.veiculos || ""}</td>
                            <td style="color:#666; font-size:10px">${v.data || ""}</td>
                            <td>${v.vez || ""}</td>
                            <td class="col-patio">${v.patio || ""}</td>
                            <td>${v.cubagem || ""}</td>
                        </tr>`;
                    });
                    tabelaBody.innerHTML = conteudoHtml;
                }
            } catch (err) { 
                console.error("Erro ao atualizar dados:", err); 
            }
        }
    </script>
</body>
</html>
