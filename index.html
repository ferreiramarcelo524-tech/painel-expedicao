<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA EXPEDIÇÃO CD-84</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #58a6ff;
            --red: #da3633;
            --yellow: #d29922;
            --green: #3fb950;
            --border: rgba(255, 255, 255, 0.08);
            --text: #c9d1d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Container Principal Responsivo */
        .dashboard-container {
            display: flex;
            flex-direction: row;
            flex: 1;
            height: 100vh; /* Para TVs */
            overflow: hidden;
        }

        /* --- SIDEBAR (METAS) --- */
        .sidebar {
            width: 240px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            align-items: center;
            flex-shrink: 0;
        }

        .brand { font-weight: 900; font-size: 0.75rem; margin-bottom: 25px; opacity: 0.6; text-transform: uppercase; }

        .indicator-card { text-align: center; margin-bottom: 30px; width: 100%; }
        
        .progress-ring { position: relative; width: 120px; height: 120px; margin: 0 auto; }
        .progress-ring svg { transform: rotate(-90deg); width: 120px; height: 120px; }
        .progress-ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
        .circle-bg { stroke: rgba(255,255,255,0.05); }
        .circle-bar { stroke-dasharray: 345; stroke-dashoffset: 345; transition: stroke-dashoffset 1s ease, stroke 0.5s ease; }

        .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; font-weight: 800; }
        .indicator-label { font-size: 10px; font-weight: 700; color: #8b949e; text-transform: uppercase; margin-top: 10px; }
        .indicator-value { font-size: 0.95rem; font-weight: 800; margin-top: 5px; word-break: break-all; }

        /* --- CONTEÚDO CENTRAL --- */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            gap: 15px; 
            overflow: hidden; 
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header-top h1 { font-size: 1.5rem; font-weight: 900; }
        .header-top h1 span { color: var(--accent); }
        
        .cub-box { text-align: right; }
        .cub-box small { font-size: 10px; color: #8b949e; font-weight: 700; }
        .cub-box b { display: block; font-size: 1.2rem; color: var(--green); }

        .data-panel { 
            background: var(--panel); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            flex: 1; 
            overflow: hidden; 
        }
        
        .panel-title { padding: 15px 20px; background: rgba(255,255,255,0.01); border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 800; color: var(--accent); }

        .table-wrapper { flex: 1; overflow: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { position: sticky; top: 0; background: #161b22; padding: 12px 8px; font-size: 10px; color: #8b949e; text-transform: uppercase; z-index: 2; border-bottom: 1px solid var(--border); }
        td { padding: 12px 8px; font-size: 12px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; }

        /* --- FILA LATERAL --- */
        .right-aside { 
            width: 280px; 
            padding: 20px 20px 20px 0; 
            flex-shrink: 0; 
            display: flex; 
            flex-direction: column; 
        }
        .queue-card { height: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .queue-card .panel-title { color: var(--yellow); }

        /* --- RESPONSIVIDADE (MOBILE) --- */
        @media (max-width: 1024px) {
            .dashboard-container { flex-direction: column; height: auto; overflow: visible; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; justify-content: space-around; }
            .indicator-card { width: 45%; margin-bottom: 15px; }
            .right-aside { width: 100%; padding: 20px; }
            .main-content { height: 600px; } /* Altura fixa para scroll interno no mobile */
        }

        @media (max-width: 600px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .indicator-card { width: 100%; }
        }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 9px; font-weight: 800; border: 1px solid currentColor; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="brand">CD-84 MATEUS</div>
            
            <div class="indicator-card">
                <div class="progress-ring">
                    <svg><circle class="circle-bg" cx="60" cy="60" r="55"></circle><circle class="circle-bar" id="bar_dia" cx="60" cy="60" r="55"></circle></svg>
                    <div class="percentage" id="perc_dia">0%</div>
                </div>
                <p class="indicator-label">Faturamento Hoje</p>
                <div class="indicator-value" id="val_dia">R$ 0,00</div>
            </div>

            <div class="indicator-card">
                <div class="progress-ring">
                    <svg><circle class="circle-bg" cx="60" cy="60" r="55"></circle><circle class="circle-bar" id="bar_mes" cx="60" cy="60" r="55"></circle></svg>
                    <div class="percentage" id="perc_mes">0%</div>
                </div>
                <p class="indicator-label">Meta Mensal (21M)</p>
                <div class="indicator-value" id="val_mes">R$ 0,00</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="header-top">
                <h1>Painel de <span>Expedição</span></h1>
                <div class="cub-box">
                    <small>CUBAGEM TOTAL CARREGADA</small>
                    <b id="txt_cub_total">0,000 m³</b>
                </div>
            </div>

            <section class="data-panel">
                <div class="panel-title">PEDIDOS EM CARREGAMENTO</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Filial</th>
                                <th>Doca</th>
                                <th>Valor</th>
                                <th>Veículo</th>
                                <th>Horário</th>
                            </tr>
                        </thead>
                        <tbody id="listaPedidos"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <aside class="right-aside">
            <div class="queue-card">
                <div class="panel-title">FILA DE PÁTIO</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 25%">Vez</th>
                                <th style="width: 45%">Placa</th>
                                <th style="width: 30%">Cub.</th>
                            </tr>
                        </thead>
                        <tbody id="listaFila"></tbody>
                    </table>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const ENDPOINT = "https://script.google.com/macros/s/AKfycbzqz9AHx8ahymUnlaIkmBLcXjDMXFRfB5pR9uyauFatDA2Y_tXZmdufL8AiU2m3MQdO1A/exec";

        function getColor(p) {
            if (p < 50) return "#da3633";
            if (p < 90) return "#d29922";
            return "#3fb950";
        }

        function updateCircle(idBar, idPerc, idVal, percent, valStr) {
            const circle = document.getElementById(idBar);
            const circ = 2 * Math.PI * 55;
            const offset = circ - (percent / 100 * circ);
            const color = getColor(percent);

            circle.style.strokeDasharray = circ;
            circle.style.strokeDashoffset = offset;
            circle.style.stroke = color;

            document.getElementById(idPerc).innerText = Math.round(percent) + "%";
            document.getElementById(idPerc).style.color = color;
            document.getElementById(idVal).innerText = valStr;
            document.getElementById(idVal).style.color = color;
        }

        async function refresh() {
            try {
                const r = await fetch(ENDPOINT);
                const d = await r.json();

                if(d.faturamento) {
                    let v = parseFloat(d.faturamento.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateCircle('bar_dia', 'perc_dia', 'val_dia', Math.min((v/954545)*100, 100), d.faturamento);
                }

                if(d.faturamentoMes) {
                    let vm = parseFloat(d.faturamentoMes.replace(/[R$\s.]/g, '').replace(',', '.')) || 0;
                    updateCircle('bar_mes', 'perc_mes', 'val_mes', Math.min((vm/21000000)*100, 100), d.faturamentoMes);
                }

                // Tabela Pedidos
                document.getElementById('listaPedidos').innerHTML = d.veiculos.filter(v => v.doca && v.tipo).map(v => {
                    let c = v.tipo.includes("ABASTECIMENTO") ? "#f39c12" : v.tipo.includes("ELETRO") ? "#2ecc71" : "#da3633";
                    return `<tr>
                        <td><span class="badge" style="color:${c}">${v.tipo}</span></td>
                        <td>${v.filial}</td>
                        <td style="color:var(--yellow)">${v.doca}</td>
                        <td style="color:var(--green)">${v.valor}</td>
                        <td>${v.veiculos || '---'}</td>
                        <td style="color:#555; font-size:10px">${v.data}</td>
                    </tr>`;
                }).join('');

                // Fila
                document.getElementById('listaFila').innerHTML = d.veiculos.filter(v => v.vez || v.patio).map(v => `
                    <tr>
                        <td style="color:var(--yellow); font-size:16px">${v.vez || '--'}</td>
                        <td style="color:var(--accent)">${v.patio || v.veiculos || '---'}</td>
                        <td style="color:#666">${v.cubagem || '0m³'}</td>
                    </tr>
                `).join('');

                document.getElementById('txt_cub_total').innerText = "620.534 m³";

            } catch (e) { console.error("Erro de sincronização", e); }
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
