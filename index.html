<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Expedição CD-84</title>
    
    <style>
        /* CONFIGURAÇÕES VISUAIS DO PAINEL */
        :root {
            --cor-mateus: #2ecc71;
            --cor-fundo: #1a1a1a;
            --cor-texto: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* HEADER E MEDIDOR MENSAL */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #222;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #medidor-mensal {
            text-align: center;
            padding: 20px;
            border: 2px solid var(--cor-mateus);
            border-radius: 15px;
            min-width: 300px;
            background: rgba(46, 204, 113, 0.1);
        }

        .valor-meta {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--cor-mateus);
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
        }

        /* TABELA DE PEDIDOS */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #333;
            color: var(--cor-mateus);
            padding: 15px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #333;
            font-size: 1.1rem;
        }

        .btn-finalizar {
            background-color: var(--cor-mateus);
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn-finalizar:active {
            transform: scale(0.9);
        }

        /* ============================================================
           SISTEMA DE PARTÍCULAS (OTIMIZADO SMART TV)
           ============================================================ */
        
        .particula-faturamento {
            position: fixed;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #2ecc71, #27ae60);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
            /* Transição suave para movimento e escala */
            transition: left 1.2s cubic-bezier(0.42, 0, 0.58, 1), 
                        top 1.2s cubic-bezier(0.42, 0, 0.58, 1), 
                        transform 1.2s ease-in, 
                        opacity 1.2s ease-in;
        }

        /* Efeito de sumiço da linha do pedido */
        .linha-expedida {
            pointer-events: none;
            filter: blur(8px);
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.8s ease-in-out;
        }

    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>EXPEDIÇÃO CD-84</h1>
            <p>Status em tempo real das docas</p>
        </div>
        <div id="medidor-mensal">
            <div>ACUMULADO MENSAL</div>
            <div class="valor-meta" id="display-mensal">R$ 15.420.000,00</div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Carga / Veículo</th>
                <th>Valor dos Pedidos</th>
                <th>Operação</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <tr id="linha-1">
                <td>CARGA NORDESTE - PLACA ABC-1234</td>
                <td><strong>R$ 45.000,00</strong></td>
                <td><button class="btn-finalizar" onclick="processarFinalizacao('linha-1', 45000)">FINALIZAR</button></td>
            </tr>
            <tr id="linha-2">
                <td>CARGA SUL - PLACA XYZ-9876</td>
                <td><strong>R$ 120.000,00</strong></td>
                <td><button class="btn-finalizar" onclick="processarFinalizacao('linha-2', 120000)">FINALIZAR</button></td>
            </tr>
            <tr id="linha-3">
                <td>CARGA LOCAL - PLACA JKL-5544</td>
                <td><strong>R$ 12.800,00</strong></td>
                <td><button class="btn-finalizar" onclick="processarFinalizacao('linha-3', 12800)">FINALIZAR</button></td>
            </tr>
        </tbody>
    </table>

    <script>
        // Função que une a animação com a lógica de dados
        function processarFinalizacao(idLinha, valor) {
            // 1. Executa a animação visual
            dispararAnimacao(idLinha, 'medidor-mensal');

            // 2. Simulação de atualização de dados (Aqui você ligaria ao seu Google Sheets)
            console.log("Finalizando carga no valor de R$ " + valor);
        }

        function dispararAnimacao(idLinha, idDestino) {
            const linha = document.getElementById(idLinha);
            const destino = document.getElementById(idDestino);

            if (!linha || !destino) return;

            const rectOrigem = linha.getBoundingClientRect();
            const rectDestino = destino.getBoundingClientRect();

            // Inicia o efeito de desintegrar a linha
            linha.classList.add('linha-expedida');

            // CONFIGURAÇÃO: 50 partículas para efeito intenso
            const quantidade = 50;

            for (let i = 0; i < quantidade; i++) {
                setTimeout(() => {
                    const bolinha = document.createElement('div');
                    bolinha.className = 'particula-faturamento';
                    
                    // Posição inicial (Centro da linha com espalhamento aleatório)
                    const randomX = (Math.random() - 0.5) * 60;
                    const randomY = (Math.random() - 0.5) * 30;

                    bolinha.style.left = (rectOrigem.left + rectOrigem.width / 2 + randomX) + 'px';
                    bolinha.style.top = (rectOrigem.top + rectOrigem.height / 2 + randomY) + 'px';
                    bolinha.style.transform = 'scale(1)';
                    bolinha.style.opacity = '1';

                    document.body.appendChild(bolinha);

                    // Forçar o navegador a processar a posição inicial
                    setTimeout(() => {
                        // Mover para o medidor mensal com leve variação de destino
                        const destX = (Math.random() - 0.5) * 50;
                        bolinha.style.left = (rectDestino.left + rectDestino.width / 2 + destX) + 'px';
                        bolinha.style.top = (rectDestino.top + rectDestino.height / 2) + 'px';
                        bolinha.style.transform = 'scale(0.1)'; 
                        bolinha.style.opacity = '0';
                    }, 50);

                    // Remove do sistema para não pesar a memória da TV
                    setTimeout(() => bolinha.remove(), 1500);

                }, i * 25); // Intervalo curto (25ms) para criar um fluxo contínuo
            }

            // Remove a linha da tabela após a animação terminar
            setTimeout(() => {
                linha.style.display = 'none';
            }, 1000);
        }
    </script>
</body>
</html>
